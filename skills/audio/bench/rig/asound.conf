pcm_type.sa631 { lib "/opt/sa631/libasound_module_pcm_sa631.so" }
# a DAC: every rate of the standards' list, 16/24/32 bit
pcm.sa_dac { type sa631; rates "44100 48000 88200 96000 176400 192000"; formats "S16_LE S24_3LE S32_LE"; channels 2; out "/run/sa631/dac.raw" }
# a device that takes 48 kHz only (many laptops' codecs and cheap USB sound cards)
pcm.sa_only48 { type sa631; rates "48000"; formats "S16_LE S32_LE"; channels 2; out "/run/sa631/only48.raw" }
# a 16-bit-only device (rates of a CD player's DAC), the "weak hardware" format case
pcm.sa_pcm16 { type sa631; rates "44100 48000"; formats "S16_LE"; channels 2; out "/run/sa631/pcm16.raw" }
# an HDMI sink of a TV whose audio block lists 32 44.1 48 88.2 96 kHz (CTA-861)
pcm.sa_hdmi { type sa631; rates "32000 44100 48000 88200 96000"; formats "S16_LE S24_3LE S32_LE"; channels 2; out "/run/sa631/hdmi.raw" }
# a Bluetooth A2DP-like sink (SBC): 44.1 and 48 kHz, 16 bit
pcm.sa_bt { type sa631; rates "44100 48000"; formats "S16_LE"; channels 2; out "/run/sa631/bt.raw" }
# a USB DAC plugged in during the session
pcm.sa_hot { type sa631; rates "44100 48000 88200 96000"; formats "S16_LE S24_3LE S32_LE"; channels 2; out "/run/sa631/hot.raw" }
