# (a) The iMac14,1's FaceTime HD Camera as row 678 describes it: white balance temperature inactive while automatic white balance
# is on (its reading moves by itself, 5537 and on), and Iris, Relative with minimum 0, maximum 0, step 0 that reads 88.
# The other controls are an ordinary UVC set for the rows that must keep working; the real camera's full list was not given.
card FaceTime HD Camera
bus usb-0000:00:14.0-5
format YUYV YUYV_4:2:2
size 1280x720 30,15
size 640x480 30
ctrl brightness int -64 64 1 0 clamp
ctrl contrast int 0 95 1 32 clamp
ctrl white_balance_automatic bool 0 1 1 1
ctrl white_balance_temperature int 2800 6500 1 4600 master=white_balance_automatic:0 auto=5537 clamp
ctrl iris_relative int 0 0 0 0 value=88 refuse
ctrl power_line_frequency menu 0 2 1 1 Disabled 50_Hz 60_Hz
