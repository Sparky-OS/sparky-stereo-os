# (b) The A10's real camera (uvcvideo, EasyCamera, usb-0000:00:12.0-1.4), from inputs/a10-easycamera-controls-and-formats.txt:
# white_balance_temperature inactive under white_balance_automatic (it reads its manual value then: the A10 kept 3000 in a 0.1.1
# store), sharpness 0..100 with default 120 (the driver clamps).
card EasyCamera: EasyCamera
bus usb-0000:00:12.0-1.4
format YUYV YUYV_4:2:2
size 640x480 30
size 160x120 30
size 320x240 30
ctrl brightness int 0 100 1 50 clamp
ctrl contrast int 0 100 1 50 clamp
ctrl saturation int 0 100 1 50 clamp
ctrl hue int 0 100 1 50 clamp
ctrl white_balance_automatic bool 0 1 1 1
ctrl gamma int 0 100 1 50 clamp
ctrl power_line_frequency menu 0 2 1 1 Disabled 50_Hz 60_Hz
ctrl white_balance_temperature int 2500 6500 10 4500 master=white_balance_automatic:0 clamp
ctrl sharpness int 0 100 1 120 value=50 clamp
ctrl auto_exposure menu 0 3 1 3 Auto_Mode Manual_Mode Shutter_Priority_Mode Aperture_Priority_Mode
ctrl exposure_dynamic_framerate bool 0 1 1 0 value=1
