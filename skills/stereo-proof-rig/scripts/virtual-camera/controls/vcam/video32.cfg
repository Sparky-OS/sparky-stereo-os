# (c) One control of each flag the V4L2 API defines (VIDIOC_QUERYCTRL, "Control Flags") and every relative or speed control; focus_absolute is governed by a control with a higher id.
# Each starts at a reading that differs from its default, so a page that saves the camera's state would save it if it were a setting.
card Virtual camera flags
bus usb-vcam-0000:00:01.0-32
format YUYV YUYV_4:2:2
size 640x480 30
ctrl brightness int 0 255 1 128 value=100
ctrl contrast int 0 255 1 32 value=40 readonly
ctrl saturation int 0 255 1 64 value=70 writeonly
ctrl hue int -180 180 1 0 value=7 volatile
ctrl gamma int 0 500 1 100 value=120 exec
ctrl gain int 0 255 1 0 value=9 grabbed
ctrl sharpness int 0 10 1 3 value=4 update
ctrl backlight_compensation int 0 2 1 1 value=2 slider
ctrl rotate int 0 270 90 0 value=90 layout
ctrl whichminmax_ctrl int 0 10 1 5 value=6 whichminmax
ctrl disabled_ctrl int 0 10 1 5 value=6 disabled
ctrl lut_ctrl u8 0 255 1 0
ctrl roi_ctrl u8 0 255 1 0 dynarray
ctrl big_ctrl int64 0 100 1 0 value=3
ctrl white_balance_automatic bool 0 1 1 1
ctrl white_balance_temperature int 2800 6500 1 4600 master=white_balance_automatic:0 auto=5100
ctrl focus_absolute int 0 250 5 0 master=focus_automatic_continuous:0 auto=60
ctrl focus_automatic_continuous bool 0 1 1 1
ctrl norange_ctrl int 0 0 0 0 value=5
ctrl pan_relative int -100 100 1 0 value=0 writeonly
ctrl tilt_relative int -100 100 1 0 value=3
ctrl focus_relative int -10 10 1 0 value=2
ctrl zoom_relative int -10 10 1 0 value=1
ctrl iris_relative int -10 10 1 0 value=4
ctrl zoom_continuous int -10 10 1 0 value=5
ctrl pan_speed int -10 10 1 0 value=6
ctrl tilt_speed int -10 10 1 0 value=7
ctrl pan_reset button 0 0 0 0
