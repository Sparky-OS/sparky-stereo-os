# (d) Several resolutions and frame rates in two pixel formats, listed the way a driver does (small first, YUYV first).
# Best (resolution, then rate): MJPG 2592x1944 at 15. Qt's own choice (at least 29 fps, then size): MJPG 1920x1080 at 30.
# The first of the driver's list, what a client with no preference of its own negotiates: YUYV 640x480 at 30.
card Virtual camera modes
bus usb-vcam-0000:00:01.0-33
format YUYV YUYV_4:2:2
size 640x480 30,15
size 1280x720 10,5
size 2592x1944 5,2
format MJPG Motion-JPEG
size 640x480 30
size 1280x720 60,30
size 1920x1080 30
size 2592x1944 15,10
ctrl brightness int 0 255 1 128
