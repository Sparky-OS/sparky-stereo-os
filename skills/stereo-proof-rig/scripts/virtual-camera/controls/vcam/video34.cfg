# (e) The Sony VAIO Duo 13's front camera (Realtek 0bda:5722) as a known machine's caveat would describe it: if its uncompressed
# picture were wrong, the machine's entry names MJPG and the best mode is MJPG's largest. The sizes are illustrative: the camera's
# real list was not given. YUYV offers a larger size than MJPG here so the caveat changes the result.
card Integrated Camera: Integrated C
bus usb-0000:00:14.0-7
format YUYV YUYV_4:2:2
size 640x480 30
size 1280x720 10
size 1600x1200 5
format MJPG Motion-JPEG
size 640x480 30
size 1280x720 30
ctrl brightness int 0 255 1 128
