# ORDER 63 M1 rig: Calamares with the edition's branding, straight to its install step (where the slideshow shows), whose
# only job waits; nothing is installed.
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]
instances:
- id: wait
  module: shellprocess
  config: shellprocess-wait.conf
sequence:
- exec:
  - shellprocess@wait
branding: sparky
prompt-install: false
dont-chroot: true
oem-setup: false
disable-cancel: true
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
