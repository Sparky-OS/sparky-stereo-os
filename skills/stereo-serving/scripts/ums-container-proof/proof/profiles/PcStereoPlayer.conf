#----------------------------------------------------------------------------
# Profile for a PC that plays on a UPnP AV request: Rygel's MPRIS plugin in front of an
# MPRIS2 player. Rygel announces its own strings; the player decodes every packing and
# declares the pair to the compositor itself, so the file goes as it is, never converted
# (no Output3DFormat), in any container and codec the player can read.
# Proposal of the Sparky Stereo OS edition; the container proof loads it from the test folder.
#----------------------------------------------------------------------------

RendererName = PC stereo player (Rygel MPRIS)
UpnpDetailsSearch = ^.*Rygel Developers.*Rygel.*$
LoadingPriority = 2

MaxVideoWidth = 0
MaxVideoHeight = 0
SupportedVideoBitDepths = 8,10

# Supported video formats: any codec and any audio, whatever the player's decoders take
Supported = f:avi|divx        m:video/avi
Supported = f:flv             m:video/x-flv
Supported = f:mkv             m:video/x-matroska
Supported = f:mov             m:video/quicktime
Supported = f:mp4             m:video/mp4
Supported = f:mpegps|mpegts   m:video/mpeg
Supported = f:wmv             m:video/x-ms-wmv

# Supported audio formats:
Supported = f:flac   m:audio/flac
Supported = f:mp3    m:audio/mpeg
Supported = f:oga    m:audio/ogg
Supported = f:wav    m:audio/wav

SupportedExternalSubtitlesFormats = ASS,MICRODVD,SAMI,SUBRIP,TEXT,VOBSUB
SupportedInternalSubtitlesFormats = ASS,DIVX,DVBSUB,MICRODVD,SAMI,SUBRIP,TEXT,TX3G,USF,VOBSUB
