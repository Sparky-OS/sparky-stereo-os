#----------------------------------------------------------------------------
# Test profile: a renderer that takes H.264 in MPEG-TS and wants full side by side.
# Not shipped; the container proof selects it by the User-Agent of its renderer.
#----------------------------------------------------------------------------
RendererName = Proof Transport Stream
UserAgentSearch = ProofTransportStream/1\.0
LoadingPriority = 2
Output3DFormat = sbsl
TranscodeVideo = MPEGTS-H264-AC3
MaxVideoWidth = 3840
MaxVideoHeight = 2160
