<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene tester</title>
<style>
  :root { --fg: #1d1d1f; --bg: #f3f3f5; --panel: #ffffff; --line: #d0d0d6; --muted: #6b6b75; --proc: #7b61c9; --down: #3a8fd8;
          --blend: #e0a32b; --pic: #3aa760; --bad: #c8372d; --bar: #e6e6ec; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e8e8ea; --bg: #141416; --panel: #1d1d21; --line: #3a3a42; --muted: #9a9aa5; --bar: #2c2c33; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  main { display: flex; height: 100vh; }
  #view { flex: 1; position: relative; min-width: 0; }
  #view canvas { width: 100%; height: 100%; display: block; }
  #first { position: absolute; left: 12px; top: 10px; background: rgba(0,0,0,.55); color: #fff; padding: 3px 8px; border-radius: 4px; }
  aside { width: 460px; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 10px 12px; }
  h1 { font-size: 15px; margin: 0 0 2px; } h2 { font-size: 12px; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .note { color: var(--muted); font-size: 11px; margin: 0 0 8px; }
  .headline { font-weight: 600; margin: 4px 0 6px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
  .row label { min-width: 120px; color: var(--muted); }
  select, input, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }
  button { cursor: pointer; }
  table { width: 100%; border-collapse: collapse; } td, th { padding: 2px 4px; text-align: left; vertical-align: middle; } th { color: var(--muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { position: relative; height: 12px; background: var(--bar); border-radius: 3px; overflow: hidden; min-width: 70px; }
  .bar.big { height: 15px; } .bar.big > b { position: absolute; left: 5px; top: 0; font-size: 10.5px; line-height: 15px; font-weight: 500; color: var(--fg); white-space: nowrap; }
  #detail td { padding: 1px 4px; } #detail td:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--down); }
  .bar.done > i { background: var(--pic); } .bar.bad > i { background: var(--bad); width: 100% !important; } .bar.proc > i { background: var(--proc); }
  #stream { height: 16px; }
  #msgs div { color: var(--bad); margin: 2px 0; } #msgs div.info { color: var(--muted); }
  #timeline { width: 100%; height: 150px; display: block; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; font-size: 11px; color: var(--muted); }
  .legend i { width: 10px; height: 10px; display: inline-block; border-radius: 2px; }
  @media (max-width: 900px) { main { flex-direction: column; height: auto; } #view { height: 56vh; } aside { width: auto; border-left: none; } }
</style>
</head>
<body>
<main>
  <div id="view"><canvas id="scene"></canvas><div id="first" hidden></div></div>
  <aside id="panel"></aside>
</main>
<script type="module" src="tester.js"></script>
</body>
</html>
